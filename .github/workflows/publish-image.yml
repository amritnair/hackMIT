name: Publish the image

# So that running Prophecy is one paste rather than a clone and a build:
#
#   docker run -p 8000:8000 ghcr.io/amritnair/prophecy
#
# That is the missing half of the published site. The page can already hand
# somebody their MCP settings, a one-click Cursor install and the Claude Code
# line; all of it points at an instance they have to be running.

on:
  push:
    branches: [main]
    paths:
      - 'prophecy/**'
      - 'Dockerfile'
      - 'pyproject.toml'
      - '.github/workflows/publish-image.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: publish-image
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # arm64 as well as amd64: half the people who try this are on an
      # Apple laptop, and an amd64-only image makes them wait on emulation
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Built for this runner only, so it can actually be started and asked
      # questions before anyone is told to pull it.
      - name: Build it for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: prophecy:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run it and use it
        run: |
          docker run -d --name prophecy-test -p 8000:8000 prophecy:test
          for _ in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:8000/ && break
            sleep 2
          done

          echo "--- the dashboard"
          # -L because the container is started with --open, so / redirects
          # to the repository it was built around. Following it is the point:
          # this asserts a page, not a redirect.
          code=$(curl -fsSL -o /tmp/page.html -w '%{http_code}' http://127.0.0.1:8000/)
          echo "page $code"
          test "$code" = "200"
          grep -q "Prophecy" /tmp/page.html

          echo "--- the demo project it ships with"
          curl -fsS http://127.0.0.1:8000/api/risk > /tmp/risk.json
          python3 -c "
          import json
          d = json.load(open('/tmp/risk.json'))
          assert len(d['changes']) == 5, d['changes']
          assert d['interactions'], 'no interactions'
          print('risk', d['repository']['score'], 'across', len(d['changes']), 'changes')
          "

          echo "--- MCP, the way an agent would"
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"jsonrpc":"2.0","id":1,"method":"tools/list"}' \
            http://127.0.0.1:8000/mcp > /tmp/tools.json
          python3 -c "
          import json
          t = json.load(open('/tmp/tools.json'))['result']['tools']
          assert len(t) == 8, [x['name'] for x in t]
          print('mcp tools:', ', '.join(x['name'] for x in t))
          "

          echo "--- writing, which is the half the published site cannot do"
          curl -fsS -X POST -H 'content-type: application/json' \
            -d '{"path":"app/models.py","content":"# written through the API"}' \
            http://127.0.0.1:8000/api/save | python3 -c "
          import json, sys
          d = json.load(sys.stdin)
          assert d.get('saved') == 'app/models.py', d
          print('saved', d['saved'])
          "
          docker rm -f prophecy-test

      - name: Publish it
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/prophecy:latest
            ghcr.io/${{ github.repository_owner }}/prophecy:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
