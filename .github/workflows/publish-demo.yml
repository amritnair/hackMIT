name: Publish the demo

# The published dashboard reads recorded answers, so it goes stale the moment
# the engine changes. This rebuilds the demo project, re-runs the export and
# commits the result, so the site cannot silently disagree with the code.

on:
  push:
    branches: [main]
    # docs/** is deliberately absent: this workflow writes there, and listing
    # it would make every run trigger the next one.
    paths:
      - 'prophecy/**'
      - 'tools/export_static.py'
      - '.github/workflows/publish-demo.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-demo
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install
        run: pip install -e .

      # Cloning rather than rebuilding, so the commit shas stay put. Building
      # the fixture fresh each run changed every sha, and every recorded
      # answer that mentions one, which was most of them.
      - name: Fetch the demo project
        run: |
          git clone --quiet https://github.com/amritnair/prophecy-demo.git /tmp/prophecy-demo
          cd /tmp/prophecy-demo
          # as local branches, the way somebody's own checkout has them:
          # work in flight is read from local branches, not remote refs
          for b in $(git branch -r | grep -v HEAD | sed 's|origin/||'); do
            git branch --track "$b" "origin/$b" 2>/dev/null || true
          done
          git branch | wc -l

      # Sessions go stale after 30 minutes, so this is seeded on every run
      # rather than committed: a frozen database publishes an empty Crew tab.
      - name: Seed the agent history
        run: python3 -c "from prophecy import demo; print(demo.seed('/tmp/prophecy-demo'))"

      - name: Record every answer
        run: python3 tools/export_static.py /tmp/prophecy-demo

      - name: Publish if anything moved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs
          if git diff --cached --quiet; then
            echo "the recorded answers are unchanged"
            exit 0
          fi
          git commit -m "Refresh the published demo"
          git push
